[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bolee-agent-service"
version = "0.1.0"
description = "Agno AgentOS service for the Bolee insurance platform"
requires-python = ">=3.11,<4"
dependencies = [
    "agno[os,openai]==3.2.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "PyJWT[crypto]>=2.10,<3.0",
    "pydantic>=2.10,<3.0",
    "pgvector>=0.3,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pypdf>=5.0,<7.0",
    "python-docx>=1.1,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.packages.find]
include = ["app*", "db*"]
