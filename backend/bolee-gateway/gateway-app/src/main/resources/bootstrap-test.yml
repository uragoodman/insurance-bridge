#服务配置
server:
  #端口
  port: 7068
  #服务编码
  tomcat:
    uri-encoding: UTF-8
spring:
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true
  config:
    activate:
      on-profile:
        - test
  #应用配置
  application:
    #应用名称
    name: gateway-app
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDRESS:${NACOS_ADDRESS:127.0.0.1:18848}} # nacos注册中心
        group: SEATA_GROUP
        service: ${spring.application.name}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
      config:
        server-addr: ${NACOS_ADDRESS:${NACOS_ADDRESS:127.0.0.1:18848}} # nacos注册中心
        group: SEATA_GROUP
        file-extension: yml
        shared-configs: # 共享配置
          - data-id: shared-spring-security.yml #配置文件名-DataId
            group: SEATA_GROUP
            refresh: false
          - data-id: shared-redisson.yml #配置文件名-DataId
            group: SEATA_GROUP
            refresh: false
          - data-id: shared-stream-rabbit-basic.yml #配置文件名-DataId
            group: SEATA_GROUP
            refresh: false
          - data-id: shared-stream-rabbit-source-log.yml #配置文件名-DataId
            group: SEATA_GROUP
            refresh: false
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
logging:
  config: classpath:logback.xml
