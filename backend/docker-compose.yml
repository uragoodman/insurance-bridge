name: bolee-public-dev
services:
  #mysql数据库脚本
  mysql:
    image: mysql:8.0.28
    container_name: mysql
    restart: always
    ports:
      - 3306:3306
    volumes:
      - ./mysql/mydir:/mydir
      - ./mysql/data:/var/lib/mysql
      - ./mysql/conf/my.cnf:/etc/my.cnf
      - ./mysql/source:/docker-entrypoint-initdb.d/
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    networks:
      extnetwork:
        ipv4_address: 172.25.0.2
  #nacos服务脚本
  nacos:
    image: nacos/nacos-server:2.0.2
    container_name: nacos
    restart: always
    ports:
      - "127.0.0.1:18848:8848"
    environment:
      SPRING_DATASOURCE_PLATFORM: mysql #数据源平台 仅支持mysql或不保存empty
      MODE: standalone
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      NACOS_APPLICATION_PORT: 8848
      JVM_XMS: 512m
      JVM_MMS: 256m
      JVM_XMN: 128m
    networks:
      extnetwork:
        ipv4_address: 172.25.0.3
    depends_on:
      - mysql
  #seata服务脚本
  seata-server:
    image: seataio/seata-server:2.0.0
    container_name: seata-server
    restart: always
    ports:
      - "9200:9200"
    volumes:
      - ./seata-server/config:/root/seata-config
    environment:
      SEATA_IP: ${SEATA_IP:-172.25.0.4}
      SEATA_CONFIG_NAME: file:/root/seata-config/registry
      SEATA_PORT: 9200
    networks:
      extnetwork:
        ipv4_address: 172.25.0.4
    depends_on:
      - nacos
  #rabbitmq脚本
  rabbitmq:
    image: rabbitmq:3.8.3-management
    container_name: rabbitmq
    restart: always
    ports:
      - 15672:15672
      - 5672:5672
    volumes:
      - ./rabbitmq/data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
    networks:
      extnetwork:
        ipv4_address: 172.25.0.5
  xxl-job:
    image: xuxueli/xxl-job-admin:2.1.2
    container_name: xxl-job-admin
    restart: always
    ports:
      - 8280:8080
    volumes:
      - ./xxl-job/data:/data/applogs
    environment:
      PARAMS: "--spring.datasource.url=jdbc:mysql://mysql:3306/xxl-job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai --spring.datasource.username=root --spring.datasource.password=${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}"
    networks:
      extnetwork:
        ipv4_address: 172.25.0.9
    depends_on:
      - mysql
  redis:
    image: redis:5.0.0
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    ports:
      - 6379:6379
    volumes:
      - ./redis/data:/data
    networks:
      extnetwork:
        ipv4_address: 172.25.0.10
  sentinel:
    image: bladex/sentinel-dashboard
    container_name: sentinel
    ports:
      - 8858:8858
    networks:
      extnetwork:
        ipv4_address: 172.25.0.12
  elasticsearch:
    image: elasticsearch:7.12.1
    ports:
      - "19200:9200"
      - "19300:9300"
    environment:
      - "discovery.type=single-node"
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - "/root/elasticsearch:/usr/share/elasticsearch/plugins"
    restart: always
    networks:
      extnetwork:
        ipv4_address: 172.25.0.13
  kibana:
    image: kibana:7.12.1
    links:
      - elasticsearch
    environment:
      - "ELASTICSEARCH_URL=http://elasticsearch:19200"
    ports:
      - "15601:5601"
    depends_on:
      - elasticsearch
    restart: always
    networks:
      extnetwork:
        ipv4_address: 172.25.0.14
  logstash:
    image: logstash:7.12.1
    ports:
      - 5044:5044
    volumes:
      - "/root/logstash:/usr/share/logstash/pipeline"
    restart: always
    networks:
      extnetwork:
        ipv4_address: 172.25.0.15
  influxdb:
    image: influxdb:1.8.0
    container_name: influxdb
    restart: always
    ports:
      - 9083:8083
      - 8086:8086
      - 8088:8088
    privileged: true
    volumes:
      - ./influxdb/data/influxdb:/var/lib/influxdb
      - ./influxdb/config/influxdb.conf:/etc/influxdb/influxdb.conf
  agentos-db:
    image: agnohq/pgvector:18
    container_name: bolee-agentos-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - agno_pgdata:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${AGNO_DB_USER:-ai}
      POSTGRES_PASSWORD: ${AGNO_DB_PASSWORD:?Set AGNO_DB_PASSWORD in .env}
      POSTGRES_DB: ${AGNO_DB_NAME:-agentos}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AGNO_DB_USER:-ai} -d ${AGNO_DB_NAME:-agentos}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      extnetwork:
        ipv4_address: 172.25.0.17
  agno-agent:
    build:
      context: ./bolee-agent-service
    container_name: bolee-agno-agent
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AGNO_AGENT_HOST_PORT:-18000}:8000"
    environment:
      AGNO_MODEL_API_KEY: ${AGNO_MODEL_API_KEY:-}
      AGNO_OAUTH_TOKEN_URL: ${AGNO_OAUTH_TOKEN_URL:-http://host.docker.internal:7078/oauth/service-token}
      AGNO_OAUTH_CLIENT_ID: ${AGNO_OAUTH_CLIENT_ID:-}
      AGNO_OAUTH_CLIENT_SECRET: ${AGNO_OAUTH_CLIENT_SECRET:-}
      AGNO_OAUTH_SCOPE: ${AGNO_OAUTH_SCOPE:-product.catalog.read policy.own.read}
      AGNO_OAUTH_TOKEN_KEY_URL: ${AGNO_OAUTH_TOKEN_KEY_URL:-http://host.docker.internal:7078/oauth/token_key}
      AGNO_CHAT_OAUTH_CLIENT_ID: ${AGNO_CHAT_OAUTH_CLIENT_ID:-}
      AGNO_CHAT_OAUTH_SCOPE: ${AGNO_CHAT_OAUTH_SCOPE:-agent.chat}
      AGNO_OPERATOR_OAUTH_CLIENT_ID: ${AGNO_OPERATOR_OAUTH_CLIENT_ID:-}
      AGNO_OPERATOR_OAUTH_SCOPE: ${AGNO_OPERATOR_OAUTH_SCOPE:-agent.operator}
      AGNO_TAG_GENERATION_CLIENT_ID: ${AGNO_TAG_GENERATION_CLIENT_ID:-}
      AGNO_TAG_GENERATION_SCOPE: ${AGNO_TAG_GENERATION_SCOPE:-product.tags.generate}
      AGNO_MODEL_ID: ${AGNO_MODEL_ID:-deepseek-chat}
      AGNO_MODEL_BASE_URL: ${AGNO_MODEL_BASE_URL:-https://api.deepseek.com/v1}
      AGNO_CONTEXT_WINDOW_TOKENS: ${AGNO_CONTEXT_WINDOW_TOKENS:-32768}
      AGNO_CONTEXT_FIXED_TOKENS: ${AGNO_CONTEXT_FIXED_TOKENS:-6000}
      AGNO_CONTEXT_OUTPUT_RESERVE_TOKENS: ${AGNO_CONTEXT_OUTPUT_RESERVE_TOKENS:-4096}
      AGNO_CONTEXT_SAFETY_MARGIN_TOKENS: ${AGNO_CONTEXT_SAFETY_MARGIN_TOKENS:-2048}
      AGNO_CONTEXT_TOOL_RESULT_RESERVE_TOKENS: ${AGNO_CONTEXT_TOOL_RESULT_RESERVE_TOKENS:-8192}
      AGNO_CONTEXT_SOFT_LIMIT_RATIO: ${AGNO_CONTEXT_SOFT_LIMIT_RATIO:-0.75}
      AGNO_CONTEXT_RECENT_TURNS: ${AGNO_CONTEXT_RECENT_TURNS:-6}
      AGNO_CONTEXT_KEEP_RECENT_TURNS: ${AGNO_CONTEXT_KEEP_RECENT_TURNS:-2}
      AGNO_CONTEXT_SUMMARY_MAX_CHARS: ${AGNO_CONTEXT_SUMMARY_MAX_CHARS:-4000}
      AGNO_CONTEXT_SUMMARY_MODEL_ID: ${AGNO_CONTEXT_SUMMARY_MODEL_ID:-}
      AGNO_TOOL_RESULT_MAX_TOKENS: ${AGNO_TOOL_RESULT_MAX_TOKENS:-1200}
      AGNO_CONTEXT_SESSION_LOCK_TIMEOUT_SECONDS: ${AGNO_CONTEXT_SESSION_LOCK_TIMEOUT_SECONDS:-30}
      AGNO_DB_HOST: agentos-db
      AGNO_DB_PORT: 5432
      AGNO_DB_USER: ${AGNO_DB_USER:-ai}
      AGNO_DB_PASSWORD: ${AGNO_DB_PASSWORD:?Set AGNO_DB_PASSWORD in .env}
      AGNO_DB_NAME: ${AGNO_DB_NAME:-agentos}
      AGNO_JAVA_SERVICE_URL: ${AGNO_JAVA_SERVICE_URL:-http://host.docker.internal:17065}
      AGNO_JAVA_HTTP_TIMEOUT_SECONDS: ${AGNO_JAVA_HTTP_TIMEOUT_SECONDS:-10}
      AGNO_TELEMETRY: "false"
    networks:
      extnetwork:
        ipv4_address: 172.25.0.16
    depends_on:
      agentos-db:
        condition: service_healthy
# docker容器内网地址
networks:
  extnetwork:
    name: extnetwork
    external: true
volumes:
  agno_pgdata:
    name: ${AGNO_POSTGRES_VOLUME:-bolee-public-agno-pgdata}



