#服务配置
server:
  #端口
  port: 7066
  #服务编码
  tomcat:
    uri-encoding: UTF-8
spring:
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
  profiles:
    active: dev
  #应用配置
  application:
    #应用名称
    name: insurance-mgt
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.200.129:8848 # nacos注册中心
        group: SEATA_GROUP
        service: ${spring.application.name}
      config:
        server-addr: 192.168.200.129:8848 # nacos配置中心地址
        group: SEATA_GROUP
        file-extension: yml
        shared-configs: # 共享配置
          - data-id: shared-spring-seata.yml #配置文件名-DataId
            group: SEATA_GROUP
            refresh: false
          - data-id: shared-spring-task.yml #配置文件名-DataId
            group: SEATA_GROUP
            refresh: false
          - data-id: shared-redisson.yml #配置文件名-DataId
            group: SEATA_GROUP
            refresh: false
          - data-id: shared-mybatis-plus.yml #配置文件名-DataId
            group: SEATA_GROUP
            refresh: false
          - data-id: shared-stream-rabbit-basic.yml #配置文件名-DataId
            group: SEATA_GROUP
            refresh: false
          - data-id: shared-stream-rabbit-source-warranty.yml #配置文件名-DataId
            group: SEATA_GROUP
            refresh: false
logging:
  config: classpath:log4j2-spring.xml
insurance:
  terms:
    storage:
      enabled: ${INSURANCE_TERMS_STORAGE_ENABLED:false}
      endpoint: ${INSURANCE_TERMS_MINIO_ENDPOINT:http://127.0.0.1:19000}
      access-key: ${INSURANCE_TERMS_MINIO_ACCESS_KEY:}
      secret-key: ${INSURANCE_TERMS_MINIO_SECRET_KEY:}
      bucket: ${INSURANCE_TERMS_MINIO_BUCKET:insurance-source-files}
      max-file-size-bytes: ${INSURANCE_TERMS_MAX_FILE_SIZE_BYTES:52428800}
