#服务配置
server:
  #端口
  port: 7080
  #服务编码
  tomcat:
    uri-encoding: UTF-8
spring:
  influx:
    url: ${INFLUX_URL:http://127.0.0.1:8086}
    password: ${INFLUX_PASSWORD:}
    user: ${INFLUX_USER:admin}
    mapper-location: com.itheima.bolee.points.mapper
  profiles:
    active: dev
  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  #应用配置
  application:
    #应用名称
    name: points-web
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDRESS:127.0.0.1:18848} # nacos注册中心
        group: SEATA_GROUP
        service: ${spring.application.name}
      config:
        server-addr: ${NACOS_ADDRESS:127.0.0.1:18848} # nacos配置中心地址
        group: SEATA_GROUP
        file-extension: yml
        shared-configs: # 共享配置
          - data-id: shared-spring-seata.yml #配置文件名-DataId
            group: SEATA_GROUP
            refresh: false
          - data-id: shared-spring-task.yml #配置文件名-DataId
            group: SEATA_GROUP
            refresh: false
          - data-id: shared-redisson.yml #配置文件名-DataId
            group: SEATA_GROUP
            refresh: false
          - data-id: shared-mybatis-plus.yml #配置文件名-DataId
            group: SEATA_GROUP
            refresh: false
logging:
  config: classpath:logback.xml

