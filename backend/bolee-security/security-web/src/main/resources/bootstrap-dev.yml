spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: ${BOLEE_OAUTH_DB_URL:}
    username: ${BOLEE_OAUTH_DB_USERNAME:}
    password: ${BOLEE_OAUTH_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: 127.0.0.1
    port: 16379
    password: ${BOLEE_OAUTH_REDIS_PASSWORD:}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDRESS:127.0.0.1:18848}
      config:
        server-addr: ${NACOS_ADDRESS:127.0.0.1:18848}
