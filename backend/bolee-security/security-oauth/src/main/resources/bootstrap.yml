#服务配置
server:
  #端口
  port: 7078
  #服务编码
  tomcat:
    uri-encoding: UTF-8
spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  #应用配置
  application:
    #应用名称
    name: security-oauth
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.200.129:8848 # nacos注册中心
        group: SEATA_GROUP
        service: ${spring.application.name}
      config:
        server-addr: 192.168.200.129:8848 # nacos配置中心地址
        group: SEATA_GROUP
        file-extension: yml
        shared-configs: # 共享配置
          - data-id: shared-spring-task.yml #配置文件名-DataId
            group: SEATA_GROUP
            refresh: false
          - data-id: shared-redisson.yml #配置文件名-DataId
            group: SEATA_GROUP
            refresh: false
logging:
  config: classpath:logback.xml
bolee:
  oauth:
    key-store: ${BOLEE_OAUTH_KEY_STORE:}
    key-store-password: ${BOLEE_OAUTH_KEY_STORE_PASSWORD:}
    key-alias: ${BOLEE_OAUTH_KEY_ALIAS:}
    key-password: ${BOLEE_OAUTH_KEY_PASSWORD:}
agentos:
  authorization:
    admin-token:
      source-client-id: ${AGNO_AGENTOS_ADMIN_SOURCE_CLIENT_ID:insurance-mgt}
      issuer: ${AGNO_AGENTOS_ADMIN_ISSUER:bolee-security-oauth}
      audience: ${AGNO_AGENTOS_ADMIN_AUDIENCE:bolee-insurance-agent-os}
      admin-role-labels: ${AGNO_AGENTOS_ADMIN_ROLE_LABELS:admin,superman}
      auditor-role-label: ${AGNO_AGENTOS_AUDITOR_ROLE_LABEL:agent_conversation_auditor}
