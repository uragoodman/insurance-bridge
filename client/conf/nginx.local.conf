worker_processes 1;
pid logs/nginx-local.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    include proxy.conf;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    upstream app {
        server 127.0.0.1:17068;
    }

    upstream mgt {
        server 127.0.0.1:17069;
    }

    server {
        listen 18177;
        server_name localhost 127.0.0.1;
        root bolee/insurance-app;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/insurance-app/ai-assistant/chat/stream {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://app;
            proxy_set_header X-Forwarded-Host sf.app.itheima.net;
            proxy_buffering off;
            proxy_cache off;
            proxy_next_upstream off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 150s;
        }

        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://app;
            proxy_set_header X-Forwarded-Host sf.app.itheima.net;
        }
    }

    server {
        listen 18166;
        server_name localhost 127.0.0.1;
        root bolee/insurance-mgt;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://mgt;
        }
    }
}
